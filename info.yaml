# Tiny Tapeout project information
project:
  title:        "Loom protocol emulator"
  author:       "Thomas Gilbert"
  discord:      ""
  description:  "Barrel-threaded 4-thread protocol emulator: deadline timing, bit engines with CRC/NRZI/Manchester, SPI host port"
  language:     "Verilog"
  clock_hz:     50000000

  # Jane Street competition allocation. The cmos5l flow's largest valid size today
  # is 6x4 (1289.28 x 710.64 um); "8x4" is not in tile_sizes.yaml yet and fails
  # validation. Switch to 8x4 only when Tiny Tapeout adds it (see docs/tt_cmos5l_facts.md).
  tiles: "6x4"

  top_module:  "tt_um_loom"

  # Keep in sync with PROJECT_SOURCES in test/Makefile.
  # loom_isa.vh is a header for testbenches and formal only, not for synthesis.
  source_files:
    - "tt_um_loom.v"
    - "loom_top.v"
    - "loom_sync.v"
    - "loom_spi_host.v"
    - "loom_host_ctl.v"
    - "loom_imem.v"
    - "loom_core.v"
    - "loom_decode.v"
    - "loom_regfile.v"
    - "loom_alu.v"
    - "loom_timer.v"
    - "loom_pins.v"
    - "loom_fifo.v"

# Pinout. See docs/ARCHITECTURE.md section 3.1. The host SPI pins are fixed;
# everything else is a firmware-addressable pin index.
pinout:
  # Inputs
  ui[0]: "IN0 (pin index 8)"
  ui[1]: "IN1 (pin index 9)"
  ui[2]: "IN2 (pin index 10)"
  ui[3]: "IN3 (pin index 11)"
  ui[4]: "HOST_CS_n (RP2040 SPI0 CSn on the TT demo board)"
  ui[5]: "HOST_SCK (RP2040 SPI0 SCK)"
  ui[6]: "HOST_MOSI (RP2040 SPI0 TX)"
  ui[7]: "IN4 (pin index 12)"

  # Outputs
  uo[0]: "OUT0 (pin index 16)"
  uo[1]: "OUT1 (pin index 17)"
  uo[2]: "OUT2 (pin index 18)"
  uo[3]: "OUT3 (pin index 19)"
  uo[4]: "OUT4 (pin index 20)"
  uo[5]: "OUT5 (pin index 21)"
  uo[6]: "HOST_IRQ"
  uo[7]: "HOST_MISO"

  # Bidirectional pins
  uio[0]: "BIDIR0 (pin index 0, open-drain capable)"
  uio[1]: "BIDIR1 (pin index 1, open-drain capable)"
  uio[2]: "BIDIR2 (pin index 2, open-drain capable)"
  uio[3]: "BIDIR3 (pin index 3, open-drain capable)"
  uio[4]: "BIDIR4 (pin index 4, open-drain capable)"
  uio[5]: "BIDIR5 (pin index 5, open-drain capable)"
  uio[6]: "BIDIR6 (pin index 6, open-drain capable)"
  uio[7]: "BIDIR7 (pin index 7, open-drain capable)"

# Do not change!
yaml_version: 6
